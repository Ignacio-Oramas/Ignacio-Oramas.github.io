<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Ignacio Oramas</title>
    <link rel="icon" type="image/png"
        href="https://github.com/Ignacio-Oramas/Ignacio-Oramas.github.io/blob/main/favicon.png?raw=true">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <header>
        <nav>
            <div class="logo">Ignacio.dev</div>
        </nav>
    </header>

    <section class="section">
        <div class="container">
            <h2 style="text-align: center;">Contáctame</h2>
            <p style="text-align: center; margin-bottom: 2rem;">¿Tienes algún proyecto en mente o quieres saludar?
                ¡Escríbeme!</p>

            <form id="contactForm" class="contact-form"
                action="https://docs.google.com/forms/u/0/d/e/1FAIpQLSe1A3iS3sUjLvwM8HOGyoyh4AUB9ddKMivZ7ZdNTpvX_mVErQ/formResponse"
                method="POST" target="_self">
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="entry.37648321" placeholder="Tu nombre" required
                        autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="correo">Correo Electrónico</label>
                    <input type="email" id="correo" name="entry.360979461" placeholder="tu@email.com" required>
                </div>

                <div class="form-group">
                    <label for="mensaje">Mensaje</label>
                    <textarea id="mensaje" name="entry.458470135" autocomplete="off"
                        placeholder="Hola Ignacio, me gustaría hablar contigo sobre..." required></textarea>
                </div>

                <button type="submit" class="btn secondary">Enviar Mensaje</button>
            </form>
        </div>
    </section>

    <div id="notification" class="notification">
        <i class="fas fa-check-circle"></i> ¡Mensaje enviado con éxito!
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2026 Ignacio Oramas.</p>
        </div>
    </footer>

    <script>
        document.getElementById('contactForm').addEventListener('submit', function (e) {
            e.preventDefault();
            
            const form = e.target;
            const formData = new FormData(form);
            
            // Enviar datos a Google Forms usando fetch (modo no-cors para evitar problemas de redirección/CORS)
            fetch(form.action, {
                method: 'POST',
                body: formData,
                mode: 'no-cors'
            }).then(() => {
                // Mostrar notificación de éxito
                const notification = document.getElementById('notification');
                notification.classList.add('show');
                
                // Limpiar formulario
                form.reset();
                
                // Ocultar notificación después de 3 segundos
                setTimeout(() => {
                    notification.classList.remove('show');
                }, 3000);
            }).catch(error => {
                console.error('Error al enviar:', error);
                alert('Hubo un error al enviar el mensaje. Inténtalo de nuevo.');
            });
        });
    </script>
</body>

</html>
